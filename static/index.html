<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.75" />
    <title>Desenhador2D</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <h1>Desenhador2D</h1>
      <div id="controls">
        <label for="tool">Ferramenta:</label>
        <select id="tool">
          <option value="point">Ponto (1 clique)</option>
          <option value="line">Reta (2 cliques A→B)</option>
          <option value="circle">Círculo (2 cliques: centro → borda)</option>
          <option value="rect">Retângulo (2 cliques: canto → canto oposto)</option>
          <option value="triangle">Triângulo (3 cliques: A → B → C)</option>
        </select>

        <label for="filter">Redesenhar:</label>
        <select id="filter">
          <option value="all">Todos</option>
          <option value="point">Somente Pontos</option>
          <option value="line">Somente Retas</option>
          <option value="circle">Somente Círculos</option>
          <option value="rect">Somente Retângulos</option>
          <option value="triangle">Somente Triângulos</option>
        </select>
        <button id="redraw">Redesenhar</button>
        <button id="clear">Limpar Tela</button>
        <button id="refresh">Atualizar</button>
      </div>

      <div id="canvas"></div>

      <div id="edSection">
        <h3>Estrutura de Dados (ED)</h3>
        <p id="edInfo">Nenhum primitivo na ED.</p>
        <button id="showEd">Listar ED</button>
        <div id="edList"></div>
      </div>

      <div id="editor">
        <h3>Adicionar primitivo (JSON)</h3>
        <textarea id="prim" rows="6" cols="40">{"type":"point","x":10,"y":10}</textarea>
        <br/>
        <button id="addPrim">Adicionar</button>
      </div>

      <div id="logContainer">
        <h3>Logs</h3>
        <div id="log"></div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
